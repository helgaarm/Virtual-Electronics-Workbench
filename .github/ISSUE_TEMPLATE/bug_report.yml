name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the workbench. Do not include secrets or security vulnerabilities here.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest circuit and sequence of actions that demonstrate the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release, commit SHA, or date used
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, local paths, private project data, and other sensitive information first.
